name: Google Analytics live check

on:
  push:
    branches: [claude/cv-web-dirk-86dbd]
    paths: [.github/workflows/ga-check.yml]

jobs:
  ga-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Visit site, accept cookies, record Google requests
        run: |
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          const note = (t, m) => console.log(`::notice title=${t}::${String(m).replace(/\n/g, '%0A').slice(0, 900)}`);
          (async () => {
            const b = await chromium.launch();
            for (const url of ['https://dirkwouters.com/', 'http://dirkwouters.com/']) {
              const ctx = await b.newContext();
              const p = await ctx.newPage();
              const reqs = [], errs = [];
              p.on('request', r => { const u = r.url(); if (/google|gtag/.test(u)) reqs.push(r.method() + ' ' + u.split('?')[0] + (u.includes('/g/collect') ? ' en=' + (new URL(u).searchParams.get('en')) : '')); });
              p.on('requestfailed', r => { if (/google/.test(r.url())) errs.push('FAILED ' + r.url().split('?')[0] + ' ' + (r.failure() || {}).errorText); });
              p.on('pageerror', e => errs.push('JS error: ' + e.message));
              p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text()); });
              let resp;
              try { resp = await p.goto(url, { waitUntil: 'load', timeout: 30000 }); } catch (e) { note('Load ' + url, 'failed: ' + e.message); await ctx.close(); continue; }
              const finalUrl = p.url();
              const scripts = await p.$$eval('script[src]', s => s.map(x => x.getAttribute('src')).join(', '));
              const banner = await p.isVisible('#cookieBanner').catch(() => 'no banner element');
              const before = reqs.length;
              note('Load ' + url, `HTTP ${resp && resp.status()} final URL ${finalUrl}%0Ascripts: ${scripts}%0Abanner visible: ${banner}%0AGoogle requests before consent: ${before}`);
              if (banner === true) {
                await p.click('#cookieAccept');
                await p.waitForTimeout(6000);
                await p.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
                await p.waitForTimeout(4000);
              }
              const ga = await p.evaluate(() => ({ loaded: !!window.__gaLoaded, gtag: typeof window.gtag, dl: (window.dataLayer || []).length, cookies: document.cookie.split(';').filter(c => c.trim().startsWith('_ga')).map(c => c.trim().split('=')[0]).join(',') }));
              note('After accept ' + url, `requests:%0A${reqs.join('%0A') || '(none)'}%0Astate: ${JSON.stringify(ga)}%0Aerrors:%0A${errs.join('%0A') || '(none)'}`);
              await ctx.close();
            }
            await b.close();
          })();
          JS
          node check.js
