name: Deploy to web host via FTP

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Stamp asset versions so browsers fetch fresh CSS/JS
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s#href=\"styles.css\"#href=\"styles.css?v=$v\"#; s#src=\"script.js\"#src=\"script.js?v=$v\"#; s#src=\"analytics.js\"#src=\"analytics.js?v=$v\"#" index.html
          grep -n "styles.css?v=\|script.js?v=" index.html

      - name: Upload site over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          dir="public_html/"
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=2 \
            --exclude-glob .git* --exclude .git/ --exclude .github/ --exclude family/ \
            ./ "$dir"
          bye
          EOF

      - name: Diagnostics (folder listing and live check)
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          enc() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          listing=$(lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; echo '== login folder:'; pwd; echo '== contents:'; cls -1F; echo '== public_html contents:'; cls -1F public_html/; bye" 2>&1 | head -80)
          echo "::notice title=FTP listing::$(printf '%s' "$listing" | enc)"
          domains=$(lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; cls -1 domains/; bye" 2>/dev/null | sed 's#^domains/##; s#/$##')
          i=0
          for d in $domains; do
            i=$((i+1))
            for h in "$d" "www.$d"; do
              code=$(curl -s -m 20 -o /tmp/body -H "Host: $h" -w '%{http_code}' "http://$FTP_SERVER/")
              found=no; grep -qi "Strategic business architect" /tmp/body && found=yes
              echo "::notice title=Domain $i check ($h) HTTP $code - site found $found::ok"
              css=$(curl -s -m 20 -H "Host: $h" "http://$FTP_SERVER/styles.css" | grep -c "text-align: justify")
              echo "::notice title=Domain $i css ($h) justify rules $css::ok"
            done
          done
