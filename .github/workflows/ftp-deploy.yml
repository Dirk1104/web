name: Deploy to web host via FTP

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload site over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          dir="public_html/"
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=2 \
            --exclude-glob .git* --exclude .git/ --exclude .github/ --exclude family/ \
            ./ "$dir"
          bye
          EOF

      - name: Diagnostics (folder listing and live check)
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          enc() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          listing=$(lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; echo '== login folder:'; pwd; echo '== contents:'; cls -1F; echo '== public_html contents:'; cls -1F public_html/; bye" 2>&1 | head -80)
          echo "::notice title=FTP listing::$(printf '%s' "$listing" | enc)"
          for u in "http://185.182.57.21/~dirkwouters/" "http://185.182.57.21/~dirkwouters/index.html" "http://185.182.57.21/~dirkwouters/styles.css"; do
            code=$(curl -s -m 20 -o /tmp/body -w '%{http_code}' "$u")
            snippet=$(head -c 400 /tmp/body | tr -d '\r')
            echo "::notice title=Live check $code::$u%0A$(printf '%s' "$snippet" | enc)"
          done
