name: Deploy to web host via FTP

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Stamp asset versions so browsers fetch fresh CSS/JS
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s#href=\"styles.css\"#href=\"styles.css?v=$v\"#; s#src=\"script.js\"#src=\"script.js?v=$v\"#; s#src=\"analytics.js\"#src=\"analytics.js?v=$v\"#" index.html
          grep -n "styles.css?v=\|script.js?v=" index.html

      - name: Upload site over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          dir="public_html/"
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=2 \
            --exclude-glob .git* --exclude .git/ --exclude .github/ --exclude family/ \
            ./ "$dir"
          bye
          EOF

      - name: Live check
        if: always()
        run: |
          for h in dirkwouters.com www.dirkwouters.com; do
            code=$(curl -s -m 20 -o /tmp/body -w '%{http_code}' "http://$h/")
            found=no; grep -qi "Connecting strategy, organisation and execution" /tmp/body && found=yes
            echo "::notice title=Live check ($h) HTTP $code - site found $found::ok"
          done
