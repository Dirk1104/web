name: Deploy to web host via FTP

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize server directory
        id: dir
        run: |
          d="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$d" ]; then d="./"; fi
          case "$d" in */) ;; *) d="$d/";; esac
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Sync files to web host
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ${{ steps.dir.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/family/**
